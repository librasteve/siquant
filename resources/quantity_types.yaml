# Named quantity types. A type is only a name for a dimension vector (written
# with base-dimension names); `Length` is a `Quantity` whose unit has exactly
# that dimension. Several names may share one dimension (Energy/Torque,
# Frequency/Radioactivity, Dose/SpecificEnergy): nothing is inferred from a
# dimension at run time, the column's declared type decides.
#
# `unit` is an optional preferred display unit, in cell-text notation.
# `group` is the heading a menu files the type under: SI Base, Data, Size,
# Mechanical, Electromagnetic, Thermodynamic, Radiation or Other (the default).
#
# Types for angles and time arrive with the stages that add those dimensions.

- {name: Dimensionless,     dims: {}, group: Other}

- {name: Length,            dims: {Length: 1},             unit: m, group: SI Base}
- {name: Mass,              dims: {Mass: 1},               unit: kg, group: SI Base}
- {name: Current,           dims: {Current: 1},            unit: A, group: SI Base}
- {name: Temperature,       dims: {Temperature: 1},        unit: K, group: SI Base}
- {name: AmountOfSubstance, dims: {Amount: 1},             unit: mol, group: SI Base}
- {name: LuminousIntensity, dims: {LuminousIntensity: 1},  unit: cd, group: SI Base}

- {name: Area,              dims: {Length: 2},             unit: "m^2", group: Size}
- {name: Volume,            dims: {Length: 3},             unit: "m^3", group: Size}
- {name: Speed,             dims: {Length: 1, Time: -1},   unit: "m.s^-1", group: Size}
- {name: Acceleration,      dims: {Length: 1, Time: -2},   unit: "m.s^-2", group: Size}
- {name: Flow,              dims: {Length: 3, Time: -1},   unit: "m^3.s^-1", group: Size}
- {name: Frequency,         dims: {Time: -1},              unit: Hz, group: Size}
- {name: Radioactivity,     dims: {Time: -1},              unit: Bq, group: Radiation}
- {name: Density,           dims: {Mass: 1, Length: -3},   unit: "kg.m^-3", group: Mechanical}
- {name: ArealDensity,      dims: {Mass: 1, Length: -2},   unit: "kg.m^-2", group: Mechanical}
- {name: Momentum,          dims: {Mass: 1, Length: 1, Time: -1}, unit: "kg.m.s^-1", group: Mechanical}
- {name: Impulse,           dims: {Mass: 1, Length: 1, Time: -1}, unit: "N.s", group: Mechanical}
- {name: MomentOfInertia,   dims: {Mass: 1, Length: 2},    unit: "kg.m^2", group: Mechanical}
- {name: AngularMomentum,   dims: {Mass: 1, Length: 2, Time: -1}, unit: "kg.m^2.s^-1", group: Mechanical}

- {name: Force,             dims: {Mass: 1, Length: 1, Time: -2},  unit: N, group: Mechanical}
- {name: Pressure,          dims: {Mass: 1, Length: -1, Time: -2}, unit: Pa, group: Mechanical}
- {name: Energy,            dims: {Mass: 1, Length: 2, Time: -2},  unit: J, group: Mechanical}
- {name: Torque,            dims: {Mass: 1, Length: 2, Time: -2},  unit: "N.m", group: Mechanical}
- {name: Power,             dims: {Mass: 1, Length: 2, Time: -3},  unit: W, group: Mechanical}
- {name: Irradiance,        dims: {Mass: 1, Time: -3},             unit: "W.m^-2", group: Radiation}

- {name: Charge,            dims: {Current: 1, Time: 1},                              unit: C, group: Electromagnetic}
- {name: Potential,         dims: {Mass: 1, Length: 2, Time: -3, Current: -1},        unit: V, group: Electromagnetic}
- {name: Resistance,        dims: {Mass: 1, Length: 2, Time: -3, Current: -2},        unit: Ω, group: Electromagnetic}
- {name: Conductance,       dims: {Mass: -1, Length: -2, Time: 3, Current: 2},        unit: S, group: Electromagnetic}
- {name: Capacitance,       dims: {Mass: -1, Length: -2, Time: 4, Current: 2},        unit: F, group: Electromagnetic}
- {name: Inductance,        dims: {Mass: 1, Length: 2, Time: -2, Current: -2},        unit: H, group: Electromagnetic}
- {name: MagneticField,     dims: {Mass: 1, Time: -2, Current: -1},                   unit: T, group: Electromagnetic}
- {name: MagneticFlux,      dims: {Mass: 1, Length: 2, Time: -2, Current: -1},        unit: Wb, group: Electromagnetic}

- {name: Dose,              dims: {Length: 2, Time: -2},   unit: Gy, group: Radiation}
- {name: SpecificEnergy,    dims: {Length: 2, Time: -2},   unit: "J.kg^-1", group: Thermodynamic}
- {name: SpecificPower,     dims: {Length: 2, Time: -3},   unit: "W.kg^-1", group: Thermodynamic}
- {name: SpecificHeat,      dims: {Length: 2, Time: -2, Temperature: -1}, unit: "J.kg^-1.K^-1", group: Thermodynamic}
- {name: ThermalConductance, dims: {Mass: 1, Length: 2, Time: -3, Temperature: -1}, unit: "W.K^-1", group: Thermodynamic}
- {name: ThermalResistance, dims: {Mass: -1, Length: -2, Time: 3, Temperature: 1}, unit: "K.W^-1", group: Thermodynamic}
- {name: CatalyticActivity, dims: {Amount: 1, Time: -1},   unit: kat, group: Thermodynamic}

- {name: Information, dims: {Data: 1},             unit: B, group: Data}
- {name: DataRate,    dims: {Data: 1, Time: -1},   unit: "B.s^-1", group: Data}
- {name: InformationDensity, dims: {Data: 1, Length: -2}, unit: "b.m^-2", group: Data}
