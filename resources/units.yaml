# Units. Each entry has a `symbol`, a `name` (a picker label only) and exactly
# one of:
#   base: <base dimension>   a base unit of that dimension
#   defn: <unit expression>  defined over units listed EARLIER in this file,
#                            in the same notation as cell text (kg.m^2.s^-2)
#
# Optional: `factor` (decimal string, default 1; the size of the unit in the
# coherent SI unit), `offset` (decimal string, default 0; added in the unit's
# own scale before scaling, so kelvin = (celsius + 273.15) * 1), `alt`
# (typographic alternate symbols), `prefixable` (none | si | binary | both,
# default none) and `live` (true, the default, means it may be written in
# cell text; false means a column-level unit only).
#
# A printed compound unit lists positive exponents first, named derived units
# before base units, then base units in the order below (mass, length, current,
# temperature, amount, luminous intensity, and time last): N.m, kg.m.s^-2,
# A.s, m.s^-1.
#
# `g`, not `kg`, is the prefixable mass unit, at 1e-3 of the coherent kilogram,
# so `kg` is just `k` + `g` with no special case.

# SI base units.
- {symbol: g,   name: gram,     base: Mass,              factor: "0.001", prefixable: si, group: Dimensional}
- {symbol: m,   name: metre,    base: Length,            prefixable: si}
- {symbol: A,   name: ampere,   base: Current,           prefixable: si}
- {symbol: K,   name: kelvin,   base: Temperature,       prefixable: si}
- {symbol: mol, name: mole,     base: Amount,            prefixable: si}
- {symbol: cd,  name: candela,  base: LuminousIntensity, prefixable: si}
- {symbol: s,   name: second,   base: Time,              prefixable: si}

# Celsius is affine: kelvin = (celsius + 273.15). Not prefixable, and legal
# only on its own (never inside a compound unit).
- {symbol: "°C", name: degree Celsius, defn: K, offset: "273.15", alt: ["ºC"], group: Dimensional}

# SI named derived units (those that need no angle; rad, sr, lm, lx are Stage 3).
- {symbol: Hz,  name: hertz,     defn: "s^-1",                prefixable: si, group: Dimensional}
- {symbol: N,   name: newton,    defn: "kg.m.s^-2",           prefixable: si, group: Mechanical}
- {symbol: Pa,  name: pascal,    defn: "kg.m^-1.s^-2",        prefixable: si, group: Mechanical}
- {symbol: J,   name: joule,     defn: "kg.m^2.s^-2",         prefixable: si, group: Mechanical}
- {symbol: W,   name: watt,      defn: "kg.m^2.s^-3",         prefixable: si, group: Mechanical}
- {symbol: C,   name: coulomb,   defn: "A.s",                 prefixable: si, group: Electromagnetic}
- {symbol: V,   name: volt,      defn: "kg.m^2.A^-1.s^-3",    prefixable: si, group: Electromagnetic}
- {symbol: F,   name: farad,     defn: "kg^-1.m^-2.A^2.s^4",  prefixable: si, group: Electromagnetic}
- {symbol: Ω,   name: ohm,       defn: "kg.m^2.A^-2.s^-3",    prefixable: si, alt: ["Ω"], group: Electromagnetic}
- {symbol: S,   name: siemens,   defn: "kg^-1.m^-2.A^2.s^3",  prefixable: si, group: Electromagnetic}
- {symbol: Wb,  name: weber,     defn: "kg.m^2.A^-1.s^-2",    prefixable: si, group: Electromagnetic}
- {symbol: T,   name: tesla,     defn: "kg.A^-1.s^-2",        prefixable: si, group: Electromagnetic}
- {symbol: H,   name: henry,     defn: "kg.m^2.A^-2.s^-2",    prefixable: si, group: Electromagnetic}
- {symbol: Bq,  name: becquerel, defn: "s^-1",                prefixable: si, group: Radiation}
- {symbol: Gy,  name: gray,      defn: "m^2.s^-2",            prefixable: si, group: Radiation}
- {symbol: Sv,  name: sievert,   defn: "m^2.s^-2",            prefixable: si, group: Radiation}
- {symbol: kat, name: katal,     defn: "mol.s^-1",            prefixable: si}

